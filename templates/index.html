<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Upload Wazuh Files</title>
  <style>
    body{font-family:Arial;background:#f4f7fb;padding:40px}
    .card{max-width:800px;margin:30px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.06)}
    label{display:block;margin:8px 0}
    input[type=file]{margin:6px 0}
    button{background:#0b5ed7;color:#fff;padding:8px 12px;border:none;border-radius:6px;cursor:pointer}
    .flash{color:#d9534f;margin-bottom:10px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Upload Wazuh Files (Excel + PDF)</h2>
    <p>Excel/CSV supplies data, PDF supplies Alerts summary.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
      <label>Excel / CSV file:
        <input type="file" name="excel_file" accept=".xlsx,.xls,.csv" required>
      </label>
      <label>PDF file:
        <input type="file" name="pdf_file" accept=".pdf" required>
      </label>
      <button type="submit">Upload & Generate Report</button>
    </form>
  </div>
</body>
</html>
